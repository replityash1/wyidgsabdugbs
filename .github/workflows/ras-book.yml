name: Build RAS Knowledge Book

on:
  workflow_dispatch:
    inputs:

      subject_filter:
        description: "Optional subject ID. Example: rajasthan_history_culture"
        required: false
        default: ""
        type: string

      topics_per_runner:
        description: "Topics handled by each runner"
        required: false
        default: "2"
        type: string

      max_parallel:
        description: "Maximum simultaneous runners"
        required: false
        default: "10"
        type: string

permissions:
  contents: read


jobs:

  # ============================================================
  # PREPARE
  # ============================================================

  prepare:

    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.make_matrix.outputs.matrix }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Flatten syllabus
        run: |
          python scripts/flatten_syllabus.py

      - name: Apply workflow settings
        env:
          TOPICS_PER_RUNNER: ${{ inputs.topics_per_runner }}
          SUBJECT_FILTER: ${{ inputs.subject_filter }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(".")

          topics = json.loads(
              Path("work/topics.json").read_text(
                  encoding="utf-8"
              )
          )

          subject_filter = os.environ.get(
              "SUBJECT_FILTER",
              ""
          ).strip()

          if subject_filter:
              topics = [
                  topic
                  for topic in topics
                  if topic["subject_id"]
                  == subject_filter
              ]

          per_runner = int(
              os.environ.get(
                  "TOPICS_PER_RUNNER",
                  "2"
              )
          )

          batches = []

          for i in range(
              0,
              len(topics),
              per_runner
          ):

              group = topics[
                  i:i + per_runner
              ]

              batches.append(
                  {
                      "batch_id":
                          i // per_runner,

                      "topic_ids": [
                          topic["topic_id"]
                          for topic in group
                      ]
                  }
              )

          Path(
              "work/batches.json"
          ).write_text(
              json.dumps(
                  batches,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          matrix = {
              "include": [
                  {
                      "batch_id":
                          batch["batch_id"]
                  }
                  for batch in batches
              ]
          }

          output = json.dumps(
              matrix,
              separators=(
                  ",",
                  ":"
              )
          )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a"
          ) as f:
              f.write(
                  f"matrix={output}\n"
              )

          print(
              f"Selected topics: "
              f"{len(topics)}"
          )

          print(
              f"Batches: "
              f"{len(batches)}"
          )

          print(
              f"Topics per runner: "
              f"{per_runner}"
          )

      - name: Upload planning files
        uses: actions/upload-artifact@v4
        with:
          name: ras-book-plan
          path: |
            work/topics.json
            work/batches.json
          retention-days: 3


  # ============================================================
  # RESEARCH + WRITE
  # ============================================================

  research_and_write:

    needs: prepare

    strategy:
      fail-fast: false

      max-parallel: ${{ fromJSON(inputs.max_parallel) }}

      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # PYTHON
      # ----------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ----------------------------------------------------------
      # PYTHON DEPENDENCIES
      # ----------------------------------------------------------

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            requests \
            beautifulsoup4 \
            trafilatura \
            ddgs

      # ----------------------------------------------------------
      # SYSTEM DEPENDENCIES
      # ----------------------------------------------------------

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            cmake \
            build-essential \
            curl \
            wget \
            jq \
            fonts-noto-core \
            fonts-noto-extra

      # ----------------------------------------------------------
      # LLAMA.CPP
      # ----------------------------------------------------------

      - name: Cache llama.cpp
        id: llama_cache
        uses: actions/cache@v4
        with:
          path: llama.cpp
          key: llama-cpp-ubuntu-${{ runner.arch }}-qwen3

      - name: Build llama.cpp
        if: steps.llama_cache.outputs.cache-hit != 'true'
        run: |
          git clone \
            --depth 1 \
            https://github.com/ggml-org/llama.cpp.git

          cmake \
            -S llama.cpp \
            -B llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release

          cmake \
            --build llama.cpp/build \
            --config Release \
            --target llama-server \
            -j2

      # ----------------------------------------------------------
      # MODEL
      # ----------------------------------------------------------

      - name: Cache Qwen3-14B GGUF
        id: model_cache
        uses: actions/cache@v4
        with:
          path: models
          key: qwen3-14b-q4-km-v1

      - name: Download Qwen3-14B
        if: steps.model_cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p models

          echo "Downloading official Qwen GGUF..."

          wget \
            -c \
            --progress=dot:giga \
            "https://huggingface.co/Qwen/Qwen3-14B-GGUF/resolve/main/Qwen3-14B-Q4_K_M.gguf?download=true" \
            -O models/Qwen3-14B-Q4_K_M.gguf

          ls -lh models/

      # ----------------------------------------------------------
      # START LOCAL MODEL
      # ----------------------------------------------------------

      - name: Start local Qwen server
        shell: bash
        run: |
          set -euo pipefail

          ./llama.cpp/build/bin/llama-server \
            -m models/Qwen3-14B-Q4_K_M.gguf \
            -c 32768 \
            -t 4 \
            -b 256 \
            -ngl 0 \
            --host 127.0.0.1 \
            --port 8080 \
            > work-llama.log 2>&1 &

          echo $! > llama.pid

          echo "Waiting for Qwen..."

          for i in $(seq 1 120); do

            if curl \
              -s \
              http://127.0.0.1:8080/health \
              | grep -q 'ok'; then

              echo "Qwen server ready."

              break
            fi

            sleep 2

            if [ "$i" -eq 120 ]; then
              echo "Qwen failed to start."

              cat work-llama.log

              exit 1
            fi

          done

      # ----------------------------------------------------------
      # RECREATE TOPIC MATRIX
      # ----------------------------------------------------------

      - name: Flatten syllabus
        run: |
          python scripts/flatten_syllabus.py

      # ----------------------------------------------------------
      # RUN BATCH
      # ----------------------------------------------------------

      - name: Run research batch
        run: |
          python scripts/run_batch.py \
            "${{ matrix.batch_id }}"

      # ----------------------------------------------------------
      # SHOW MODEL LOG
      # ----------------------------------------------------------

      - name: Upload batch result
        uses: actions/upload-artifact@v4
        with:
          name: batch-${{ matrix.batch_id }}
          path: work/results/
          retention-days: 3
          compression-level: 6

      - name: Upload llama log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llama-log-${{ matrix.batch_id }}
          path: work-llama.log
          retention-days: 2


  # ============================================================
  # BUILD BOOK
  # ============================================================

  assemble:

    needs: research_and_write

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install book tools
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            fonts-noto-core \
            fonts-noto-extra

          python -m pip install \
            --upgrade \
            pip \
            weasyprint

      # ----------------------------------------------------------
      # DOWNLOAD ALL BATCHES
      # ----------------------------------------------------------

      - name: Download research batches
        uses: actions/download-artifact@v4
        with:
          path: collected
          pattern: batch-*
          merge-multiple: true

      # ----------------------------------------------------------
      # RESTORE TOPIC RESULTS
      # ----------------------------------------------------------

      - name: Restore results
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/results

          find collected \
            -type f \
            -name "research.json" \
            -o \
            -name "sources.json" \
            -o \
            -name "chapter.md" \
            -o \
            -name "audit.json" |
          while read -r file; do

            topic_dir="$(
              basename \
              "$(dirname "$file")"
            )"

            mkdir -p \
              "work/results/$topic_dir"

            cp \
              "$file" \
              "work/results/$topic_dir/"

          done

      # ----------------------------------------------------------
      # REBUILD TOPIC LIST
      # ----------------------------------------------------------

      - name: Flatten syllabus
        run: |
          python scripts/flatten_syllabus.py

      # ----------------------------------------------------------
      # BUILD BOOK
      # ----------------------------------------------------------

      - name: Build book
        run: |
          python scripts/build_book.py

      # ----------------------------------------------------------
      # CREATE PDF
      # ----------------------------------------------------------

      - name: Convert HTML to PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          from weasyprint import HTML

          html_file = Path(
              "output/RAS_Pre_2026_Book.html"
          )

          pdf_file = Path(
              "output/RAS_Pre_2026_Book.pdf"
          )

          HTML(
              filename=str(html_file)
          ).write_pdf(
              str(pdf_file)
          )

          print(
              f"PDF created: {pdf_file}"
          )
          PY

      # ----------------------------------------------------------
      # FINAL REPORT
      # ----------------------------------------------------------

      - name: Create final audit summary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          results = Path(
              "work/results"
          )

          audits = []

          for file in results.glob(
              "*/audit.json"
          ):

              try:
                  audits.append(
                      json.loads(
                          file.read_text(
                              encoding="utf-8"
                          )
                      )
                  )

              except Exception:
                  pass

          total = len(audits)

          passed = sum(
              a.get("status") == "PASS"
              for a in audits
          )

          failed = total - passed

          report = f"""# RAS Book Build Summary

          Topics processed: {total}

          Passed local citation audit: {passed}

          Requiring review: {failed}

          ## Review Topics

          """

          for audit in audits:

              if audit.get(
                  "status"
              ) != "PASS":

                  report += (
                      f"- {audit.get('topic_id')}\n"
                  )

          Path(
              "output/AUDIT-SUMMARY.md"
          ).write_text(
              report,
              encoding="utf-8"
          )
          PY

      # ----------------------------------------------------------
      # UPLOAD FINAL BOOK
      # ----------------------------------------------------------

      - name: Upload final book
        uses: actions/upload-artifact@v4
        with:
          name: RAS-Pre-2026-Complete-Book
          path: |
            output/
            work/results/
          retention-days: 30
          compression-level: 6
