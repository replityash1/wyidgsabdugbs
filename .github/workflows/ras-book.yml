name: Build RAS Knowledge Book

on:
  workflow_dispatch:
    inputs:

      subject_filter:
        description: "Optional subject ID. Leave blank for complete syllabus."
        required: false
        default: ""
        type: string

      topics_per_runner:
        description: "Number of topics handled by each runner"
        required: false
        default: "2"
        type: string

      max_parallel:
        description: "Maximum simultaneous runners"
        required: false
        default: "10"
        type: string

permissions:
  contents: read


jobs:

  # ================================================================
  # PREPARE
  # ================================================================

  prepare:

    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.make_matrix.outputs.matrix }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------------
      # FLATTEN SYLLABUS
      # ------------------------------------------------------------

      - name: Flatten syllabus
        run: |
          set -euo pipefail

          python scripts/flatten_syllabus.py

          echo
          echo "Total topics:"
          jq 'length' work/topics.json

      # ------------------------------------------------------------
      # BUILD MATRIX
      # ------------------------------------------------------------

      - name: Build matrix
        id: make_matrix
        env:
          SUBJECT_FILTER: ${{ inputs.subject_filter }}
          TOPICS_PER_RUNNER: ${{ inputs.topics_per_runner }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          topics = json.loads(
              Path("work/topics.json").read_text(
                  encoding="utf-8"
              )
          )

          subject_filter = os.environ.get(
              "SUBJECT_FILTER",
              ""
          ).strip()

          if subject_filter:
              topics = [
                  topic
                  for topic in topics
                  if topic["subject_id"] == subject_filter
              ]

          if not topics:
              raise SystemExit(
                  "ERROR: No topics matched the selected subject."
              )

          try:
              topics_per_runner = int(
                  os.environ.get(
                      "TOPICS_PER_RUNNER",
                      "2"
                  )
              )
          except ValueError:
              raise SystemExit(
                  "ERROR: topics_per_runner must be an integer."
              )

          if topics_per_runner < 1:
              raise SystemExit(
                  "ERROR: topics_per_runner must be >= 1."
              )

          batches = []

          for start in range(
              0,
              len(topics),
              topics_per_runner
          ):

              group = topics[
                  start:start + topics_per_runner
              ]

              batches.append(
                  {
                      "batch_id": start // topics_per_runner,
                      "topic_ids": [
                          topic["topic_id"]
                          for topic in group
                      ]
                  }
              )

          Path(
              "work/selected_topics.json"
          ).write_text(
              json.dumps(
                  topics,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          Path(
              "work/batches.json"
          ).write_text(
              json.dumps(
                  batches,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          matrix = {
              "include": [
                  {
                      "batch_id": batch["batch_id"]
                  }
                  for batch in batches
              ]
          }

          matrix_json = json.dumps(
              matrix,
              ensure_ascii=False,
              separators=(",", ":")
          )

          # This is the IMPORTANT line.
          # It writes the job output for this step.
          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as output:

              output.write(
                  "matrix="
                  + matrix_json
                  + "\n"
              )

          print()
          print("==========================================")
          print("MATRIX CREATED")
          print("==========================================")
          print(
              "Subject:",
              subject_filter or "[ALL]"
          )
          print(
              "Topics:",
              len(topics)
          )
          print(
              "Topics per runner:",
              topics_per_runner
          )
          print(
              "Batches:",
              len(batches)
          )
          print()
          print("Matrix:")
          print(matrix_json)
          print()
          print("Batches:")

          for batch in batches:
              print(
                  "  Batch",
                  batch["batch_id"],
                  "->",
                  len(batch["topic_ids"]),
                  "topics"
              )

          # Validate JSON before leaving the step.
          json.loads(matrix_json)

          print()
          print("Matrix JSON validation: PASS")
          PY

      # ------------------------------------------------------------
      # UPLOAD PLAN FOR DEBUGGING
      # ------------------------------------------------------------

      - name: Upload planning files
        uses: actions/upload-artifact@v4
        with:
          name: ras-book-plan
          path: |
            work/topics.json
            work/selected_topics.json
            work/batches.json
          retention-days: 3


  # ================================================================
  # RESEARCH + WRITING
  # ================================================================

  research_and_write:

    needs: prepare

    strategy:

      fail-fast: false

      max-parallel: ${{ fromJSON(inputs.max_parallel) }}

      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:

      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------------
      # PYTHON DEPENDENCIES
      # ------------------------------------------------------------

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          pip install \
            requests \
            beautifulsoup4 \
            trafilatura \
            ddgs

      # ------------------------------------------------------------
      # SYSTEM DEPENDENCIES
      # ------------------------------------------------------------

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            cmake \
            build-essential \
            curl \
            wget \
            jq \
            fonts-noto-core \
            fonts-noto-extra

      # ------------------------------------------------------------
      # RECREATE SAME TOPIC PLAN
      # ------------------------------------------------------------

      - name: Recreate topic plan
        env:
          SUBJECT_FILTER: ${{ inputs.subject_filter }}
          TOPICS_PER_RUNNER: ${{ inputs.topics_per_runner }}
        shell: bash
        run: |
          set -euo pipefail

          python scripts/flatten_syllabus.py

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          topics = json.loads(
              Path("work/topics.json").read_text(
                  encoding="utf-8"
              )
          )

          subject_filter = os.environ.get(
              "SUBJECT_FILTER",
              ""
          ).strip()

          if subject_filter:
              topics = [
                  topic
                  for topic in topics
                  if topic["subject_id"] == subject_filter
              ]

          if not topics:
              raise SystemExit(
                  "No matching topics."
              )

          topics_per_runner = int(
              os.environ.get(
                  "TOPICS_PER_RUNNER",
                  "2"
              )
          )

          batches = []

          for start in range(
              0,
              len(topics),
              topics_per_runner
          ):

              group = topics[
                  start:start + topics_per_runner
              ]

              batches.append(
                  {
                      "batch_id": start // topics_per_runner,
                      "topic_ids": [
                          topic["topic_id"]
                          for topic in group
                      ]
                  }
              )

          Path(
              "work/selected_topics.json"
          ).write_text(
              json.dumps(
                  topics,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          Path(
              "work/batches.json"
          ).write_text(
              json.dumps(
                  batches,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )
          PY

          echo
          echo "Selected topics:"
          jq length work/selected_topics.json

          echo
          echo "This runner:"
          jq \
            --argjson ID '${{ matrix.batch_id }}' \
            '.[] | select(.batch_id == $ID)' \
            work/batches.json

      # ==========================================================
      # LLAMA.CPP
      # ==========================================================

      - name: Cache llama.cpp
        id: llama_cache
        uses: actions/cache@v4
        with:
          path: llama.cpp
          key: llama-cpp-ubuntu-24-qwen3-v1

      - name: Build llama.cpp
        if: steps.llama_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            https://github.com/ggml-org/llama.cpp.git

          cmake \
            -S llama.cpp \
            -B llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release

          cmake \
            --build llama.cpp/build \
            --config Release \
            --target llama-server \
            -j2

      - name: Verify llama server
        shell: bash
        run: |
          set -euo pipefail

          test -x \
            llama.cpp/build/bin/llama-server

          echo "llama-server OK."

      # ==========================================================
      # MODEL
      # ==========================================================

      - name: Cache Qwen3-14B
        id: model_cache
        uses: actions/cache@v4
        with:
          path: models
          key: qwen3-14b-q4-km-v1

      - name: Download Qwen3-14B
        if: steps.model_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p models

          wget \
            -c \
            --progress=dot:giga \
            "https://huggingface.co/Qwen/Qwen3-14B-GGUF/resolve/main/Qwen3-14B-Q4_K_M.gguf?download=true" \
            -O models/Qwen3-14B-Q4_K_M.gguf

          ls -lh models/

      - name: Verify model
        shell: bash
        run: |
          set -euo pipefail

          MODEL="models/Qwen3-14B-Q4_K_M.gguf"

          if [ ! -f "$MODEL" ]; then
              echo "::error::Model missing."
              exit 1
          fi

          SIZE="$(stat -c%s "$MODEL")"

          echo "Model size: $SIZE bytes"

          if [ "$SIZE" -lt 5000000000 ]; then
              echo "::error::Model file is suspiciously small."
              exit 1
          fi

      # ==========================================================
      # LOCAL QWEN SERVER
      # ==========================================================

      - name: Start local Qwen server
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p logs

          ./llama.cpp/build/bin/llama-server \
            -m models/Qwen3-14B-Q4_K_M.gguf \
            -c 32768 \
            -t 4 \
            -b 256 \
            -ngl 0 \
            --host 127.0.0.1 \
            --port 8080 \
            > logs/llama.log 2>&1 &

          echo $! > llama.pid

          echo "Waiting for Qwen..."

          READY=0

          for i in $(seq 1 180); do

              if curl \
                -sf \
                http://127.0.0.1:8080/health \
                >/dev/null; then

                  READY=1
                  echo "Qwen is ready."
                  break

              fi

              sleep 2

          done

          if [ "$READY" -ne 1 ]; then

              echo "::error::Qwen failed to start."

              echo
              echo "========== llama.log =========="

              cat logs/llama.log

              exit 1

          fi

      # ==========================================================
      # RESEARCH
      # ==========================================================

      - name: Run research batch
        shell: bash
        run: |
          set -euo pipefail

          python scripts/run_batch.py \
            "${{ matrix.batch_id }}"

      # ==========================================================
      # UPLOAD RESULTS
      # ==========================================================

      - name: Upload batch results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-${{ matrix.batch_id }}
          path: work/results/
          retention-days: 7
          compression-level: 6

      - name: Upload llama log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llama-log-${{ matrix.batch_id }}
          path: logs/llama.log
          retention-days: 3


  # ================================================================
  # ASSEMBLE
  # ================================================================

  assemble:

    needs: research_and_write

    if: ${{ always() }}

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            fonts-noto-core \
            fonts-noto-extra \
            python3-pip

          python -m pip install \
            --upgrade \
            pip \
            weasyprint

      # ------------------------------------------------------------
      # DOWNLOAD BATCH RESULTS
      # ------------------------------------------------------------

      - name: Download batch artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: batch-*
          path: collected
          merge-multiple: true

      # ------------------------------------------------------------
      # RESTORE
      # ------------------------------------------------------------

      - name: Restore results
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/results

          find collected \
            -type f \
            \( \
              -name "research.json" \
              -o -name "sources.json" \
              -o -name "chapter.md" \
              -o -name "audit.json" \
            \) \
            -print |
          while IFS= read -r FILE; do

              TOPIC_DIR="$(
                basename \
                "$(dirname "$FILE")"
              )"

              mkdir -p \
                "work/results/$TOPIC_DIR"

              cp \
                "$FILE" \
                "work/results/$TOPIC_DIR/"

          done

          echo
          echo "Restored result files:"

          find work/results \
            -type f \
            | sort

      # ------------------------------------------------------------
      # BUILD BOOK
      # ------------------------------------------------------------

      - name: Build book
        shell: bash
        run: |
          set -euo pipefail

          python scripts/build_book.py

      # ------------------------------------------------------------
      # PDF
      # ------------------------------------------------------------

      - name: Create PDF
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          from weasyprint import HTML

          source = Path(
              "output/RAS_Pre_2026_Book.html"
          )

          target = Path(
              "output/RAS_Pre_2026_Book.pdf"
          )

          if not source.exists():
              raise SystemExit(
                  "HTML book was not generated."
              )

          HTML(
              filename=str(source)
          ).write_pdf(
              str(target)
          )

          print(
              f"Created {target}"
          )
          PY

      # ------------------------------------------------------------
      # AUDIT SUMMARY
      # ------------------------------------------------------------

      - name: Create audit summary
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import json

          results = Path(
              "work/results"
          )

          audits = []

          for file in results.glob(
              "*/audit.json"
          ):

              try:
                  audits.append(
                      json.loads(
                          file.read_text(
                              encoding="utf-8"
                          )
                      )
                  )
              except Exception:
                  pass

          passed = sum(
              audit.get("status") == "PASS"
              for audit in audits
          )

          needs_review = len(
              audits
          ) - passed

          lines = [
              "# RAS Book Audit Summary",
              "",
              f"Topics processed: {len(audits)}",
              f"Passed: {passed}",
              f"Needs review: {needs_review}",
              "",
              "## Topics needing review",
              ""
          ]

          for audit in audits:

              if audit.get(
                  "status"
              ) != "PASS":

                  lines.append(
                      "- "
                      + audit.get(
                          "topic_id",
                          "unknown"
                      )
                  )

          Path(
              "output/AUDIT-SUMMARY.md"
          ).write_text(
              "\n".join(lines),
              encoding="utf-8"
          )
          PY

      # ------------------------------------------------------------
      # FINAL ARTIFACT
      # ------------------------------------------------------------

      - name: Upload final book
        uses: actions/upload-artifact@v4
        with:
          name: RAS-Pre-2026-Knowledge-Book
          path: |
            output/
            work/results/
          retention-days: 30
          compression-level: 6
